<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Header Animation</title>
    <style>
      :root{--a:#ff3b6b;--b:#6b8cff}
      html,body{margin:0;height:100%}
      .wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(107,140,255,0.02),rgba(255,59,107,0.03))}
      svg{width:100%;height:100%}
      .blob{fill:rgba(255,59,107,0.10)}
      .blob2{fill:rgba(107,140,255,0.08)}
      .move1{animation:move1 8s ease-in-out infinite}
      .move2{animation:move2 10s ease-in-out infinite}
      @keyframes move1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12px,-6px) scale(1.03)}100%{transform:translate(0,0) scale(1)}}
      @keyframes move2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-10px,8px) scale(1.02)}100%{transform:translate(0,0) scale(1)}}
    </style>
  </head>
  <body>
    <div class="wrap" aria-hidden="true">
      <svg viewBox="0 0 1200 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="1200" height="140" fill="transparent" />
        <g class="move1">
          <ellipse class="blob" cx="120" cy="60" rx="90" ry="44" />
        </g>
        <g class="move2">
          <ellipse class="blob2" cx="420" cy="40" rx="120" ry="50" />
        </g>
        <g class="move1" transform="translate(700,0)">
          <ellipse class="blob" cx="120" cy="70" rx="100" ry="44" />
        </g>
        <path d="M0,90 C200,30 400,150 600,90 C800,30 1000,150 1200,90 L1200 140 L0 140 Z" fill="rgba(255,255,255,0.02)" />
      </svg>
    </div>
  </body>
</html>
