<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Header Animation</title>
    <style>
      :root{--accent:#fe2c55}
      html,body{margin:0;height:100%}
      .wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(254,44,85,0.08),rgba(255,122,144,0.02))}
      svg{width:100%;height:100%}
      .circle{fill:rgba(254,44,85,0.12)}
      .pulse{animation:pulse 4s infinite ease-in-out}
      .drift{animation:drift 8s infinite linear}
      @keyframes pulse{0%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}100%{opacity:0.6;transform:scale(1)}}
      @keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(8px)}100%{transform:translateX(0)}}
    </style>
  </head>
  <body>
    <div class="wrap" aria-hidden="true">
      <svg viewBox="0 0 1200 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0" x2="1">
            <stop offset="0%" stop-color="#fe2c55" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ff7a90" stop-opacity="0.06" />
          </linearGradient>
        </defs>
        <rect width="1200" height="140" fill="url(#g1)" />
        <g class="pulse" transform="translate(60,40)">
          <circle class="circle" cx="0" cy="0" r="24" opacity="0.16" />
        </g>
        <g class="drift" transform="translate(300,60)">
          <circle class="circle" cx="0" cy="0" r="14" opacity="0.12" />
        </g>
        <g transform="translate(720,32)">
          <circle class="circle" cx="0" cy="0" r="28" opacity="0.08" />
        </g>
        <path d="M0,80 C200,20 400,140 600,80 C800,20 1000,140 1200,80 L1200 140 L0 140 Z" fill="rgba(255,255,255,0.02)" />
      </svg>
    </div>
  </body>
</html>
